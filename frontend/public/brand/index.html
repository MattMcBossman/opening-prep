<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mainline logo review</title>
    <style>
      :root { font: 16px/1.45 system-ui, sans-serif; color: #1c2430; background: #eef1f6; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px 24px 64px; }
      main { width: min(1120px, 100%); margin: auto; }
      h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.04em; }
      .intro { margin: 6px 0 30px; color: #5b6472; }
      .study { margin-top: 34px; }
      .study h2 { margin: 0 0 12px; font-size: 20px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .surface { min-height: 340px; display: grid; place-items: center; border-radius: 20px; }
      .light { background: #fff; }
      .dark { background: #181b22; }
      .large { width: min(240px, 65%); }
      .small-row { display: flex; align-items: center; gap: 20px; }
      .tab { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; }
      .light .tab { background: #eef1f6; }
      .dark .tab { background: #0f1115; }
      .tab img { width: 32px; height: 32px; }
      .tab img:last-child { width: 20px; height: 20px; }
      .dark img { filter: brightness(0) saturate(100%) invert(94%) sepia(8%) saturate(294%) hue-rotate(339deg) brightness(104%); }
      .dark .tree { filter: none; }
      .logo { position: relative; }
      .logo img { display: block; width: 100%; }
      .dark .logo img { filter: none; }
      .dark svg .rook { fill: #f4efe7; }
      .note { margin: 10px 0 0; color: #5b6472; font-size: 14px; }
      svg { display: block; }
      @media (max-width: 680px) {
        body { padding: 24px 14px 48px; }
        .grid { grid-template-columns: 1fr; }
        .surface { min-height: 280px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mainline logo review</h1>
      <p class="intro">Large master and browser-tab scales, on both application themes.</p>

      <section class="study">
        <h2>Refined master</h2>
        <div class="grid">
          <div class="surface light">
            <svg class="large" viewBox="0 0 64 64" aria-label="Refined Mainline logo on light">
              <path class="rook" fill="#20242b" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/>
              <path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/>
            </svg>
          </div>
          <div class="surface dark">
            <svg class="large" viewBox="0 0 64 64" aria-label="Refined Mainline logo on dark">
              <path class="rook" fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/>
              <path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/>
            </svg>
          </div>
          <div class="surface light">
            <div class="small-row">
              <div class="tab"><svg width="32" viewBox="0 0 64 64"><path fill="#20242b" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/></svg></div>
              <div class="tab"><svg width="20" viewBox="0 0 64 64"><path fill="#20242b" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/></svg></div>
            </div>
          </div>
          <div class="surface dark">
            <div class="small-row">
              <div class="tab"><svg width="32" viewBox="0 0 64 64"><path fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/></svg></div>
              <div class="tab"><svg width="20" viewBox="0 0 64 64"><path fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="M29 21h6v15.5l7-6h3v3.5l-10 8v9h-6v-9l-10-8v-3.5h3l7 6V21Z"/></svg></div>
            </div>
          </div>
        </div>
        <p class="note">The branches and trunk are now one continuous shape with a clean, symmetric junction.</p>
      </section>

      <section class="study">
        <h2>Saved fallback</h2>
        <div class="grid">
          <div class="surface light"><img class="large" src="mainline-logo-fallback.svg" alt="Fallback logo on light" /></div>
          <div class="surface dark">
            <svg class="large" viewBox="0 0 64 64" aria-label="Fallback Mainline logo on dark"><path fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="m20 30 3 0 9 7v5L20 33v-3Zm24 0v3l-12 9v-5l9-7h3Z"/><path fill="#d36b3f" d="M29 21h6v30h-6z"/></svg>
          </div>
          <div class="surface light">
            <div class="small-row">
              <div class="tab"><svg width="32" viewBox="0 0 64 64"><path fill="#20242b" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="m20 30 3 0 9 7v5L20 33v-3Zm24 0v3l-12 9v-5l9-7h3Z"/><path fill="#d36b3f" d="M29 21h6v30h-6z"/></svg></div>
              <div class="tab"><svg width="20" viewBox="0 0 64 64"><path fill="#20242b" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="m20 30 3 0 9 7v5L20 33v-3Zm24 0v3l-12 9v-5l9-7h3Z"/><path fill="#d36b3f" d="M29 21h6v30h-6z"/></svg></div>
            </div>
          </div>
          <div class="surface dark">
            <div class="small-row">
              <div class="tab"><svg width="32" viewBox="0 0 64 64"><path fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="m20 30 3 0 9 7v5L20 33v-3Zm24 0v3l-12 9v-5l9-7h3Z"/><path fill="#d36b3f" d="M29 21h6v30h-6z"/></svg></div>
              <div class="tab"><svg width="20" viewBox="0 0 64 64"><path fill="#f4efe7" d="M8 9h12v9h7V9h10v9h7V9h12v17l-6 6v15l5 5v4H9v-4l5-5V32l-6-6V9Z"/><path fill="#d36b3f" d="m20 30 3 0 9 7v5L20 33v-3Zm24 0v3l-12 9v-5l9-7h3Z"/><path fill="#d36b3f" d="M29 21h6v30h-6z"/></svg></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
