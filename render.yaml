services:
  - type: web
    name: mainline
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./scripts/render-alpha-start
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mainline-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://localhost.invalid

databases:
  - name: mainline-db
    plan: free
    region: oregon
    databaseName: mainline
    user: mainline
