[project]
name = "opening-prep-backend"
version = "0.1.0"
description = "Django/DRF backend for Mainline: accounts, repertoire storage, explorer caching, drill stats."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=43.0",
    "requests>=2.32",
    "chess>=1.11",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "responses>=0.25",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "opening_prep.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
